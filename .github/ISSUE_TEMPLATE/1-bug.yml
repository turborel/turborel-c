name: Bug
description: Something fails, crashes, or reads or sends a wrong value.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Try the latest `main` first, and search the issues: add to one that matches.
        A vulnerability is never reported here: see SECURITY.md.
        Put a severe impact first in the title: `[WRONG VALUE]`, `[CRASH]` or `[REGRESSION]`.
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: The impact first, in a short paragraph. Then one sentence that sums it up.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Wrong value read or sent
        - Crash, abort or hang
        - Wrong status, SQLCODE or SQLSTATE
        - Memory leaked or misused
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest C program that shows it, with the schema and data it needs on the server, and the settings it connects with (never a real password).
      render: c
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, and why. Cite the spec or turborel-client's manual if it says, e.g. `[PROTOCOL Frames]`.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Give the status, SQLCODE, SQLSTATE and message, and a sanitizer's report or a backtrace if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it worked before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The operating system and version, the architecture, the compiler and its version, e.g. "Ubuntu 24.04, x86_64, GCC 14.2".
    validations:
      required: true
  - type: input
    id: libraries
    attributes:
      label: Libraries and server
      description: The TLS library and zlib, with versions, and the turborel server's release or commit.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: How often it happens, what you ruled out.
