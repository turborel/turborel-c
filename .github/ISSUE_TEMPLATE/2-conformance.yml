name: Conformance
description: turborel-c departs from the protocol spec or from turborel-client.
labels: ["conformance"]
body:
  - type: markdown
    attributes:
      value: |
        Check CONFORMANCE.md first: a row marked "not yet" is open work, not a departure.
        Where the spec and turborel-client's code differ, the code is right.
  - type: dropdown
    id: source
    attributes:
      label: Departs from
      options:
        - The protocol spec, doc/client/05-protocol.md
        - turborel-client, its manual or its code
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Where
      description: The heading, as "[PROTOCOL Execute 'E']" or "[CLIENT Pipelines]", or the file and line of turborel-client's code.
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What it says
      description: Quote the spec, the manual or the code.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Program
      description: The smallest program, or the bytes, that show the departure.
      render: c
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it requires
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What turborel-c does
      description: Its result, or its status, SQLCODE, SQLSTATE and message.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
