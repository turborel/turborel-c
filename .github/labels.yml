# Kinds
- name: "bug"
  color: "#d73a4a"
  description: "Something fails, crashes, or reads or sends a wrong value"
- name: "conformance"
  color: "#5c282b"
  description: "A departure from the protocol spec or from turborel-client"
- name: "performance"
  color: "#fbca04"
  description: "Slower than it was or should be, or too much memory"
- name: "feature"
  color: "#a2eeef"
  description: "Something turborel-c should do that it does not"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"

# Impact
- name: "impact/wrong-value"
  color: "#b60205"
  description: "A value read or sent differs from what the server holds or was given"
- name: "impact/crash"
  color: "#b60205"
  description: "A crash, abort or hang"
- name: "impact/regression"
  color: "#b60205"
  description: "Worked, or was faster, at an earlier commit"

