  color: "#c5def5"
  description: "Queries, prepared statements, cursors, describe, completions"
- name: "area/lobs"
  color: "#c5def5"
  description: "Large objects, locators and streams"
- name: "area/copy"
  color: "#c5def5"
  description: "Copy, import and export"
- name: "area/settings"
  color: "#c5def5"
  description: "The URI, options, variables, service and password files, several hosts"
- name: "area/pipeline"
  color: "#c5def5"
  description: "Pipelines"
- name: "area/pool"
  color: "#c5def5"
  description: "Pools"
- name: "area/api"
  color: "#c5def5"
  description: "include/turborel/ and what it declares"
- name: "area/odbc"
  color: "#c5def5"
  description: "The ODBC driver"
- name: "area/test"
  color: "#c5def5"
  description: "The harness and the package test"
- name: "area/doc"
  color: "#c5def5"
  description: "doc/, README.md, RULES.md, CONFORMANCE.md, TODO.md, AGENTS.md, CONTRIBUTING.md"
- name: "area/ci"
  color: "#c5def5"
  description: "The workflows, issue forms and labels in .github/, and .githooks/"
- name: "area/build"
  color: "#c5def5"
  description: "CMakeLists.txt, CMakePresets.json, cmake/, .clang-format, .clang-tidy, Doxyfile"
- name: "dependencies"
  color: "#0366d6"
  description: "A dependency, a pinned tool or an action changes (R-DEP, R-CM-1)"

# Triage
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
