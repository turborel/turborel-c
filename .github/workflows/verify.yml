# Every check a change must pass (RULES.md R-PROC-1), on each platform and
# compiler the driver claims (D3, R-PLAT-1), with the sanitizers, coverage
# and fuzzing (D4). Each job runs a workflow of CMakePresets.json, as a
# contributor does, through cmake/ci-run.cmake, which reports a failure's
# output as an annotation too.
name: verify

# A pull request is checked once, through pull_request, and main again once
# it is merged.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its checks still running.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned clang-format and clang-tidy (D4), Doxygen, and unixODBC for the ODBC driver (D2)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install -r .github/lint-requirements.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y doxygen unixodbc-dev
      - name: clang-tidy, formatting, the source rules, every test
        run: cmake "-DCOMMAND=cmake;--workflow;--preset;verify" -P cmake/ci-run.cmake
      - name: The API reference, every warning an error (R-DOC-1)
        run: cmake "-DCOMMAND=doxygen;Doxyfile" -P cmake/ci-run.cmake

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 13 and 14, each built at -O3 by its Release workflow, every
          # warning an error, as at -O0 by its Debug one.
          - { os: ubuntu-24.04, cc: gcc-13 }
          - { os: ubuntu-24.04, cc: gcc-14 }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
          - { os: windows-latest, cc: cl }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ODBC driver (D2) is built where ODBC's headers are found:
      # unixODBC's on Linux and macOS, its driver manager tested through
      # too; the Windows SDK's on Windows.
      - name: unixODBC, for the ODBC driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: unixODBC, for the ODBC driver
        if: runner.os == 'macOS'
        run: brew install unixodbc
      # The live tests run against the nightly server's image (R-TEST-8),
      # its turboreld started by the tests themselves, on the host's
      # network, as the runner's user, the workspace its files' directory.
      # macOS and Windows have no turboreld to run, so there the live tests
      # are skipped.
      - name: The nightly server, for the live tests
        if: runner.os == 'Linux'
        run: |
          docker pull ghcr.io/turborel/turborel:nightly
          echo "TRL_TEST_SERVER=docker run --rm -i --network host --user $(id -u):$(id -g) -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} ghcr.io/turborel/turborel:nightly" >> "$GITHUB_ENV"
      - name: Debug, warnings as errors
        timeout-minutes: 30
        run: cmake "-DCOMMAND=cmake;--workflow;--preset;debug" -P cmake/ci-run.cmake
      - name: Release, and the installed package
        timeout-minutes: 30
        run: cmake "-DCOMMAND=cmake;--workflow;--preset;release" -P cmake/ci-run.cmake

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ODBC driver (D2) is built where ODBC's headers are found:
      # unixODBC's on Linux and macOS, its driver manager tested through
      # too; the Windows SDK's on Windows.
      - name: unixODBC, for the ODBC driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: unixODBC, for the ODBC driver
        if: runner.os == 'macOS'
        run: brew install unixodbc
      # The live tests run against the nightly server's image (R-TEST-8),
      # its turboreld started by the tests themselves, on the host's
      # network, as the runner's user, the workspace its files' directory.
      # macOS and Windows have no turboreld to run, so there the live tests
      # are skipped.
      - name: The nightly server, for the live tests
        if: runner.os == 'Linux'
        run: |
          docker pull ghcr.io/turborel/turborel:nightly
          echo "TRL_TEST_SERVER=docker run --rm -i --network host --user $(id -u):$(id -g) -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} ghcr.io/turborel/turborel:nightly" >> "$GITHUB_ENV"
      - name: The tests under AddressSanitizer and UndefinedBehaviorSanitizer
        timeout-minutes: 30
        run: cmake "-DCOMMAND=cmake;--workflow;--preset;asan-ubsan" -P cmake/ci-run.cmake

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ODBC driver (D2) is built where ODBC's headers are found:
      # unixODBC's on Linux and macOS, its driver manager tested through
      # too; the Windows SDK's on Windows.
      - name: unixODBC, for the ODBC driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: unixODBC, for the ODBC driver
        if: runner.os == 'macOS'
        run: brew install unixodbc
      # The live tests run against the nightly server's image (R-TEST-8),
      # its turboreld started by the tests themselves, on the host's
      # network, as the runner's user, the workspace its files' directory.
      # macOS and Windows have no turboreld to run, so there the live tests
      # are skipped.
      - name: The nightly server, for the live tests
        if: runner.os == 'Linux'
        run: |
          docker pull ghcr.io/turborel/turborel:nightly
          echo "TRL_TEST_SERVER=docker run --rm -i --network host --user $(id -u):$(id -g) -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} ghcr.io/turborel/turborel:nightly" >> "$GITHUB_ENV"
      - name: Coverage of src/, held to its floors (R-COV-2)
        run: cmake "-DCOMMAND=cmake;--workflow;--preset;coverage" -P cmake/ci-run.cmake

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the fuzz targets
        run: cmake "-DCOMMAND=cmake;--workflow;--preset;fuzz" -P cmake/ci-run.cmake
      # A fixed seed and count of runs, so a run is the same each time
      # (R-TEST-5).
      - name: Fuzz the frame header
        timeout-minutes: 15
        run: cmake "-DCOMMAND=build/fuzz/fuzz/fuzz.frame;-seed=1;-runs=1000000" -P cmake/ci-run.cmake
      - name: Fuzz the reply decoder
        timeout-minutes: 15
        run: cmake "-DCOMMAND=build/fuzz/fuzz/fuzz.reply;-seed=1;-runs=2000000;-max_len=4096" -P cmake/ci-run.cmake
      - name: Fuzz JSON's stored form and text
        timeout-minutes: 15
        run: cmake "-DCOMMAND=build/fuzz/fuzz/fuzz.json;-seed=1;-runs=2000000;-max_len=4096" -P cmake/ci-run.cmake
