# A release's archives, built and tested on each platform (VERSIONING.md).
# Run only by hand. It publishes nothing: the publish job is written but
# turned off, and the owner turns it on once every driver is done.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test, the installed package too
        run: cmake --workflow --preset release
      - name: Install into the archive's directory
        run: cmake --install build/release --config Release --prefix "libturborel-${{ runner.os }}"
      - name: The archive
        run: cmake -E tar cf "libturborel-${{ runner.os }}.zip" --format=zip "libturborel-${{ runner.os }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libturborel-${{ runner.os }}
          path: libturborel-${{ runner.os }}.zip

  publish:
    needs: build
    # Off: nothing is published until every turborel driver is done. The
    # owner turns this on, by removing this line, for the release.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The version, from the header (RULES.md D5)
        id: version
        run: echo "version=$(sed -n 's/^#define TRL_VERSION_STRING "\(.*\)"$/\1/p' include/turborel/turborel.h)" >> "$GITHUB_OUTPUT"
      - name: Download the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --dir archives
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" archives/*/*.zip --title "libturborel ${{ steps.version.outputs.version }}" --notes "The C driver of turborel ${{ steps.version.outputs.version }}."
